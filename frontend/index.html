<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Match Day</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1c1f24; }
      main { max-width: 760px; margin: 0 auto; padding: 16px; }
      h1 a { color: inherit; text-decoration: none; }
      table { width: 100%; border-collapse: collapse; background: #fff; }
      th, td { padding: 8px; border-bottom: 1px solid #e3e6ea; text-align: right; }
      th:nth-child(2), td:nth-child(2) { text-align: left; }
      input, select, textarea, button { font: inherit; padding: 8px; margin: 4px 0; box-sizing: border-box; }
      input, textarea, select { width: 100%; }
      button { background: #1f6feb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
      .card { background: #fff; padding: 12px 16px; border-radius: 8px; margin: 12px 0; }
      .error { color: #b42318; } .muted { color: #667085; } code { word-break: break-all; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
